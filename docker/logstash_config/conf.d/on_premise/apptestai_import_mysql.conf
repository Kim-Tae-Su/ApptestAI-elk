```conf
input {
    jdbc {
        # 실제 사내 경로 및 DB 정보는 공개하지 않음
        jdbc_driver_library => "/path/to/mysql-connector-java.jar"
        jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

        # 실제 서버 주소 / DB명 / 계정 정보는 환경변수 또는 별도 설정으로 관리
        jdbc_connection_string => "jdbc:mysql://<DB_HOST>:3306/<DATABASE>"
        jdbc_user => "${DB_USER}"
        jdbc_password => "${DB_PASSWORD}"

        jdbc_paging_enabled => true

        # 주기적인 DB 조회
        schedule => "*/5 * * * * Asia/Seoul"

        # 실제 사내 View명 대신 일반화
        statement => "SELECT * FROM <VIEW_NAME>"
    }
}

filter {
    mutate {
        convert => {
            "created_at" => "string"
        }

        # 실제 디바이스 식별 정보 정규화
        gsub => [
            "device", "_VENDOR_PATTERN", "",
            "device", "Apple", "",
            "device", "SAMSUNG", "",
            "device", "_DEVICE_PATTERN", "",
            "device", "LGE", "",
            "device", "_VERSION_PATTERN", "",
            "device", "_NUMBER", "",
            "device", "_SCENARIO_PATTERN", "",
            "device", "\(ver [^)]+\)", "",
            "device", "\s", "",
            "device", "_", ""
        ]

        split => {
            "device" => "/"
        }

        add_field => {
            "os_version" => "%{[device][1]}"
            "device_name" => "%{[device][0]}"
        }

        remove_field => ["device"]
    }

    # 디바이스 명칭 표준화
    translate {
        source => "device_name"
        target => "device_name"

        dictionary => {
            "DEVICE_A" => "DEVICE_A_STANDARD"
            "DEVICE_B" => "DEVICE_B_STANDARD"
            "DEVICE_C" => "DEVICE_C_STANDARD"
            "randomdevice" => "RANDOM DEVICE"
        }

        override => true
    }

    # 테스트 유형 코드 → 사람이 읽을 수 있는 이름으로 변환
    translate {
        source => "is_scenario"
        target => "test_type"

        dictionary => {
            "1" => "시나리오"
            "0" => "자율탐색"
        }

        remove_field => ["is_scenario"]
    }

    # 애플리케이션 ID → 애플리케이션 이름으로 변환
    # 실제 고객사 / 애플리케이션명 및 ID는 공개하지 않음
    translate {
        source => "uid"
        target => "app_name"

        fallback => "기타"

        dictionary => {
            "APP_ID_1" => "APP_A"
            "APP_ID_2" => "APP_B"
            "APP_ID_3" => "APP_C"
            "APP_ID_4" => "APP_D"
        }
    }

    # 앱 소스 정보 표준화
    translate {
        source => "app_source"
        target => "app_sources"

        fallback => "app_id"

        dictionary => {
            "ipa" => "binary_file"
            "apk" => "binary_file"
        }

        remove_field => ["app_source"]
    }

    # 프로젝트/테스트 유형 코드 매핑
    translate {
        source => "pid"
        target => "test_type_detail"

        dictionary => {
            "PROJECT_ID_1" => "[운영/자율탐색] iOS"
            "PROJECT_ID_2" => "[운영/자율탐색] Android"
            "PROJECT_ID_3" => "[운영/시나리오] iOS"
            "PROJECT_ID_4" => "[운영/시나리오] Android"
            "PROJECT_ID_5" => "CI/CD"
        }
    }

    # DB의 시간 데이터를 Elasticsearch timestamp로 변환
    date {
        match => ["created_at", "ISO8601"]
        timezone => "Asia/Seoul"
        locale => "ko"
        target => "@timestamp"
    }

    date {
        match => ["ctime", "HH:mm:ss"]
        timezone => "Asia/Seoul"
        locale => "ko"
        target => "ctimestamp"
        remove_field => ["ctime"]
    }
}

output {
    elasticsearch {
        # 실제 Elasticsearch 주소는 공개하지 않음
        hosts => ["https://<ELASTICSEARCH_HOST>:9200"]

        user => "${ELASTIC_USER}"
        password => "${ELASTIC_PASSWORD}"

        ssl => true
        cacert => "/path/to/http_ca.crt"

        index => "example-index"

        ilm_enabled => false

        # 실제 문서 식별 방식은 유지하되 구체적인 DB 구조는 공개하지 않음
        document_id => "%{[id]}"
    }
}
```
