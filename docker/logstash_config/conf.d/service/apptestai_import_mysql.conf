```conf
input {
    jdbc {
        # JDBC Driver
        jdbc_driver_library => "/usr/share/java/mysql-connector-java.jar"
        jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

        # 실제 DB 접속 정보는 공개하지 않음
        jdbc_connection_string => "jdbc:mysql://<DB_HOST>:3306/<DATABASE>"
        jdbc_user => "${DB_USER}"
        jdbc_password => "${DB_PASSWORD}"

        jdbc_paging_enabled => true

        # 매 시간 15분에 DB 조회
        schedule => "15 * * * * Asia/Seoul"

        # 실제 사내 View명은 공개하지 않음
        statement => "SELECT * FROM <VIEW_NAME>"
    }
}

filter {

    mutate {
        convert => {
            "created_at" => "string"
        }

        # 디바이스 정보 정규화
        gsub => [
            "device", "_VENDOR_PATTERN", "",
            "device", "Apple", "",
            "device", "SAMSUNG", "",
            "device", "_DEVICE_PATTERN", "",
            "device", "LGE", "",
            "device", "_VERSION_PATTERN", "",
            "device", "_NUMBER", "",
            "device", "_SCENARIO_PATTERN", "",
            "device", "\(ver [^)]+\)", "",
            "device", "\s", "",
            "device", "_", ""
        ]

        split => {
            "device" => "/"
        }

        # 디바이스명과 OS 버전 분리
        add_field => {
            "os_version" => "%{[device][1]}"
            "device_name" => "%{[device][0]}"
        }

        remove_field => ["device"]
    }

    # 디바이스명 표준화
    translate {
        source => "device_name"
        target => "device_name"

        dictionary => {
            "DEVICE_A" => "DEVICE_A_STANDARD"
            "DEVICE_B" => "DEVICE_B_STANDARD"
            "DEVICE_C" => "DEVICE_C_STANDARD"
            "DEVICE_D" => "DEVICE_D_STANDARD"
            "DEVICE_E" => "DEVICE_E_STANDARD"
            "RANDOM_DEVICE" => "RANDOM DEVICE"
        }

        override => true
    }

    # 테스트 유형 코드 변환
    translate {
        source => "is_scenario"
        target => "test_type"

        dictionary => {
            "1" => "시나리오"
            "0" => "자율탐색"
        }

        remove_field => ["is_scenario"]
    }

    # 애플리케이션 ID → 애플리케이션명 변환
    # 실제 고객사 및 애플리케이션 정보는 공개하지 않음
    translate {
        source => "uid"
        target => "app_name"

        fallback => "기타"

        dictionary => {
            "APP_ID_001" => "APP_A"
            "APP_ID_002" => "APP_B"
            "APP_ID_003" => "APP_C"
            "APP_ID_004" => "APP_D"
            "APP_ID_005" => "APP_E"
            "APP_ID_006" => "APP_F"
            "APP_ID_007" => "APP_G"
            "APP_ID_008" => "APP_H"
            "APP_ID_009" => "APP_I"
            "APP_ID_010" => "APP_J"
            "APP_ID_011" => "APP_K"
            "APP_ID_012" => "APP_L"
            "APP_ID_013" => "APP_M"
            "APP_ID_014" => "APP_N"
            "APP_ID_015" => "APP_O"
            "APP_ID_016" => "APP_P"
        }
    }

    # 애플리케이션 파일 형식 변환
    translate {
        source => "app_source"
        target => "app_sources"

        fallback => "app_id"

        dictionary => {
            "ipa" => "binary_file"
            "apk" => "binary_file"
        }

        remove_field => ["app_source"]
    }

    # 프로젝트 / 테스트 유형 코드 변환
    # 실제 프로젝트 ID는 공개하지 않음
    translate {
        source => "pid"
        target => "test_type_detail"

        dictionary => {
            "PROJECT_ID_001" => "[운영/자율탐색] iOS"
            "PROJECT_ID_002" => "[운영/자율탐색] Android"
            "PROJECT_ID_003" => "[운영/시나리오] iOS"
            "PROJECT_ID_004" => "[운영/시나리오] Android"
            "PROJECT_ID_005" => "Android CI/CD"
        }
    }

    # 생성 시간을 Elasticsearch @timestamp로 변환
    date {
        match => ["created_at", "ISO8601"]
        timezone => "Asia/Seoul"
        locale => "ko"
        target => "@timestamp"
    }

    # 시간 데이터를 별도의 timestamp 필드로 변환
    date {
        match => ["ctime", "HH:mm:ss"]
        timezone => "Asia/Seoul"
        locale => "ko"
        target => "ctimestamp"
        remove_field => ["ctime"]
    }

    # 필요에 따라 시간 단위 필드를 추가할 수 있음
    #
    # mutate {
    #     add_field => {
    #         "[hour]" => "%{+HH}"
    #         "[minute]" => "%{+mm}"
    #         "[second]" => "%{+ss}"
    #     }
    # }
}

output {
    elasticsearch {
        # 실제 Elasticsearch 서버 정보는 공개하지 않음
        hosts => ["https://<ELASTICSEARCH_HOST>:9200"]

        ssl => true

        # 실제 인증서 경로는 공개하지 않음
        cacert => "/path/to/http_ca.crt"

        # 인증정보는 환경변수로 관리
        user => "${ELASTIC_USER}"
        password => "${ELASTIC_PASSWORD}"

        # 공개용 인덱스명
        index => "example-index"

        ilm_enabled => false

        # 문서 ID 생성 방식
        document_id => "%{[id]}"
    }
}
```
